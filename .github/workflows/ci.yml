name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NikoStore.sln

      - name: Build
        run: dotnet build NikoStore.sln --no-restore -c Release

      - name: Test
        run: dotnet test NikoStore.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      - name: Check for pending model changes
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes -p src/Infrastructure -s src/Api
